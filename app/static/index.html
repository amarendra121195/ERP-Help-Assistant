<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ERP Help Assistant</title>
<style>
  :root { --bg: #f6f7f9; --card: #fff; --text: #1d2330; --muted: #6b7280; --line: #e3e6eb; --accent: #2563eb; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--text); }
  main { max-width: 820px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; height: 100vh; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-bottom: 12px; }
  h1 { font-size: 18px; margin: 0; }
  select, input, button { font: inherit; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; }
  #chat { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding: 4px 0 12px; }
  .msg { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; white-space: pre-wrap; }
  .me { align-self: flex-end; background: #e8f0fe; border-color: #c9dafc; max-width: 85%; }
  .meta { margin-top: 8px; font-size: 12px; color: var(--muted); white-space: normal; }
  .tag { display: inline-block; padding: 1px 8px; border-radius: 999px; background: #eef1f5; margin-right: 6px; }
  form { display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; }
  button { background: var(--accent); color: #fff; border-color: var(--accent); cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
</style>
</head>
<body>
<main>
  <header>
    <h1>ERP Help Assistant</h1>
    <label>User
      <select id="user">
        <option value="U01">U01 - Riverside (C01)</option>
        <option value="U02">U02 - Greenleaf + Coastal (C02, C03)</option>
        <option value="U03">U03 - Group finance (all)</option>
      </select>
    </label>
  </header>
  <div id="chat"></div>
  <form id="form">
    <input id="question" placeholder="Ask a how-to, policy or PO data question" autocomplete="off" required>
    <button id="send">Ask</button>
  </form>
</main>
<script>
  const chat = document.getElementById("chat");

  function escapeHtml(text) {
    return text.replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
  }

  function add(html, cls) {
    const div = document.createElement("div");
    div.className = "msg " + (cls || "");
    div.innerHTML = html;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
    return div;
  }

  document.getElementById("form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const input = document.getElementById("question");
    const button = document.getElementById("send");
    const user = document.getElementById("user").value;
    const question = input.value.trim();
    if (!question) return;

    add(`<b>${user}:</b> ${escapeHtml(question)}`, "me");
    input.value = "";
    button.disabled = true;
    const reply = add("Thinking...");
    try {
      const response = await fetch("/ask", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({user_id: user, question}),
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.detail || response.statusText);
      const answer = escapeHtml(data.answer).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
      const sources = data.sources.length ? data.sources.map(escapeHtml).join(", ") : "none";
      reply.innerHTML = answer + `<div class="meta"><span class="tag">route: ${data.route}</span>` +
        `<span class="tag">sources: ${sources}</span>` +
        `<span class="tag">${data.usage.input_tokens + data.usage.output_tokens} tokens, $${data.usage.cost_usd.toFixed(4)}</span></div>`;
    } catch (error) {
      reply.textContent = "Error: " + error.message;
    } finally {
      button.disabled = false;
      input.focus();
    }
  });
</script>
</body>
</html>
